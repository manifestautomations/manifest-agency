name: Kitchen Assistant CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./kitchen-assistant

    steps:
      - name: ⬇️ Checkout Repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './kitchen-assistant/package-lock.json'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 💅 Lint (ESLint)
        run: npm run lint
        continue-on-error: true # For now, don't fail build on lint

      - name: 🔍 Type Check (TypeScript)
        # Note: This requires tsc to be available via npm script
        # If not, add "typecheck": "tsc --noEmit" to package.json
        run: npm run typecheck
        continue-on-error: true # Allow pass until configured

      - name: 🧪 Run Tests
        run: npm test
        continue-on-error: true # Setup tests later
